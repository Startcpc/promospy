name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            python: '3.9'
          - node: 24
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:search
      - run: pnpm test:launcher
      - if: matrix.node == 22
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.node == 22
        run: pnpm build
      - if: matrix.node == 22
        run: pnpm test:ui

  portable:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:search
      - run: pnpm test:launcher

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: node scripts/test-container.mjs
      - name: Verify volume persistence after container replacement
        run: |
          docker compose exec -T promospy node -e "require('node:fs').writeFileSync('/app/data/.ci-persistence','ok')"
          docker compose up -d --no-build --force-recreate --wait --wait-timeout 120
          docker compose exec -T promospy node -e "const fs=require('node:fs');require('node:assert/strict').equal(fs.readFileSync('/app/data/.ci-persistence','utf8'),'ok');fs.unlinkSync('/app/data/.ci-persistence')"
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
